[project]
name = "claimsense"
version = "1.0.0"
description = "Predicts how an insurance ombudsman is likely to rule on a rejected health-insurance claim, with a calibrated probability and cited precedents."
readme = "README.md"
requires-python = ">=3.11,<3.12"
license = { text = "MIT" }
authors = [{ name = "Diya Shrivastava" }]
dependencies = [
    "pydantic>=2.7,<3",
    "pyyaml>=6.0",
]

[project.optional-dependencies]
dev = [
    "ruff>=0.6",
    "black>=24.8",
    "pre-commit>=3.8",
]
test = [
    "pytest>=8.2",
    "pytest-cov>=5.0",
    "pytest-socket>=0.7",
    "hypothesis>=6.100",
]
# Fine-tuning dependencies are added in PR 11.
train = []

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/claimsense"]

# --- uv: CPU-only PyTorch (docs/operations/setup.md §3.4) --------------------
# torch itself is added in PR 10. The index is declared now so that the first
# lock that includes torch resolves the CPU wheel, not a multi-GB CUDA build.
[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = [{ index = "pytorch-cpu" }]

# --- lint / format -----------------------------------------------------------
[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "B", "UP"]

[tool.ruff.lint.isort]
known-first-party = ["claimsense", "tests"]

[tool.black]
line-length = 100
target-version = ["py311"]

# --- tests -------------------------------------------------------------------
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["."]
addopts = "--strict-markers"
markers = [
    "leak: leak-probe tests in fixture mode (own CI job)",
    "e2e: end-to-end chain on the synthetic world (own CI job)",
    "local_data: needs the real data/processed/ or real artefacts; auto-skips when absent",
    "slow: loads a real heavy model; not run in CI",
]
